name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy kaggle-environments

    - name: Verify libcg.so dependencies
      run: |
        echo "Checking libcg.so shared library dependencies..."
        ldd sample_submission/cg/libcg.so || true
        for cg_so in $(find agents -name "libcg.so" 2>/dev/null); do
          ldd "$cg_so" || true
        done

    - name: Run Black formatter check
      run: |
        black --check sample_submission/main.py tests/ $(find agents -name "*.py" -not -path "*/cg/*" 2>/dev/null || true)

    - name: Run Flake8 linter
      run: |
        flake8 sample_submission/main.py tests/ $(find agents -name "*.py" -not -path "*/cg/*" 2>/dev/null || true) --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 sample_submission/main.py tests/ $(find agents -name "*.py" -not -path "*/cg/*" 2>/dev/null || true) --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Mypy type checker
      run: |
        mypy sample_submission/main.py tests/ $(find agents -name "*.py" -not -path "*/cg/*" 2>/dev/null || true) --ignore-missing-imports --follow-imports=silent

    - name: Run Dry Run validation match
      run: |
        python tests/dry_run.py
