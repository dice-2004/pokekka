name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy kaggle-environments

    - name: Verify libcg.so dependencies
      run: |
        echo "Checking libcg.so shared library dependencies..."
        ldd sample_submission/cg/libcg.so || true

    - name: Run Black formatter check
      run: |
        black --check sample_submission/main.py tests/

    - name: Run Flake8 linter
      run: |
        flake8 sample_submission/main.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 sample_submission/main.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Mypy type checker
      run: |
        mypy sample_submission/main.py --ignore-missing-imports

    - name: Run Dry Run validation match
      run: |
        python tests/dry_run.py
